name: TDR Deploy Metadata Schema and Update Dependent Repos
on:
  workflow_dispatch:
    inputs:
      update-dependent-repos-only:
        description: "Skip the release and only create PRs in dependent repos"
        type: boolean
        default: false
      version:
        description: "da-metadata-schema version to use (defaults to latest release tag)"
        type: string
        required: false

permissions: {}

jobs:
  deploy:
    if: ${{ !inputs.update-dependent-repos-only }}
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/sbt_release.yml@b469512bc31f0425270a12b87ebe68807c3a1daf # v0.0.46
    with:
      library-name: "Metadata schema"
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  update-dependent-repos:
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || (inputs.update-dependent-repos-only && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repository:
          - nationalarchives/tdr-draft-metadata-validator
          - nationalarchives/tdr-transfer-frontend
          - nationalarchives/tdr-consignment-api
          - nationalarchives/tdr-e2e-tests
          - nationalarchives/tdr-metadata-validation
    steps:
      - name: Checkout da-metadata-schema
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-tags: true
          persist-credentials: false

      - name: Get released version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            git fetch --tags --force
            TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [ -z "$TAG" ]; then
              echo "No release tag found" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Wait for artifact on Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://repo1.maven.org/maven2/uk/gov/nationalarchives/da-metadata-schema_2.13/${VERSION}/da-metadata-schema_2.13-${VERSION}.pom"
          for i in $(seq 1 60); do
            if curl -sfI "$URL" > /dev/null; then
              echo "Artifact ${VERSION} is available on Maven Central"
              exit 0
            fi
            echo "Waiting for ${VERSION} to be available on Maven Central (attempt $i/60)..."
            sleep 30
          done
          echo "Timed out waiting for ${VERSION} on Maven Central" >&2
          exit 1

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_PAT }}
          path: target-repo
          persist-credentials: false

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          git_user_signingkey: true
          git_commit_gpgsign: true
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Update da-metadata-schema version and create PR
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ matrix.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH_NAME="update-da-metadata-schema-${VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null; then
            echo "Branch $BRANCH_NAME already exists in $REPOSITORY, skipping"
            exit 0
          fi

          python3 - <<'PY'
          import os, re, sys, pathlib

          version = os.environ["VERSION"]
          repo = os.environ["REPOSITORY"]
          artifact = r'"da-metadata-schema(?:_[0-9.]+)?"'
          literal_re = re.compile(r'(' + artifact + r'\s*%\s*")[^"]+(")')
          ident_re = re.compile(artifact + r'\s*%\s*([A-Za-z_][A-Za-z0-9_.]*)')

          files = [
              p for p in pathlib.Path(".").rglob("*")
              if p.is_file() and p.suffix in (".scala", ".sbt")
              and not any(part in (".git", "target") for part in p.parts)
          ]
          contents = {p: p.read_text() for p in files}

          found = False
          idents = set()
          for text in contents.values():
              if literal_re.search(text):
                  found = True
              for m in ident_re.finditer(text):
                  found = True
                  idents.add(m.group(1).split(".")[-1])

          if not found:
              print(f"No da-metadata-schema dependency found in {repo}", file=sys.stderr)
              sys.exit(1)

          val_res = {
              i: re.compile(r'(\bva[lr]\s+' + re.escape(i) + r'\s*(?::\s*String\s*)?=\s*")[^"]+(")')
              for i in idents
          }
          resolved = set()
          for p, text in contents.items():
              new = literal_re.sub(lambda m: m.group(1) + version + m.group(2), text)
              for i, r in val_res.items():
                  if r.search(new):
                      resolved.add(i)
                      new = r.sub(lambda m: m.group(1) + version + m.group(2), new)
              if new != text:
                  p.write_text(new)
                  print(f"Updated {p}")

          missing = idents - resolved
          if missing:
              print(f"Could not find version definition for: {', '.join(sorted(missing))} in {repo}", file=sys.stderr)
              sys.exit(1)
          PY

          if git diff --quiet; then
            echo "$REPOSITORY is already on da-metadata-schema ${VERSION}, nothing to do"
            exit 0
          fi

          git config --global user.email 181243999+tna-da-bot@users.noreply.github.com
          git config --global user.name tna-da-bot
          git checkout -b "$BRANCH_NAME"
          git commit -S -am "Update da-metadata-schema to ${VERSION}"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --repo "$REPOSITORY" \
            --head "$BRANCH_NAME" \
            --title "Update da-metadata-schema to ${VERSION}" \
            --body "Automated PR to update \`da-metadata-schema\` to version \`${VERSION}\`. Created by ${RUN_URL}"
