name: TDR Run Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - uses: nationalarchives/tdr-github-actions/.github/actions/run-git-secrets@4b2753940019ebbed38030f1aca49f0eb123a45e # v0.0.55
      - uses: nationalarchives/tdr-github-actions/.github/actions/slack-send@4b2753940019ebbed38030f1aca49f0eb123a45e # v0.0.55
        if: failure()
        with:
          message: ":warning: Secrets found in repository ${{ inputs.repo-name }}"
          slack-url: ${{ secrets.SLACK_WEBHOOK }}
      - name: Run tests
        run: sbt copySchema test
