name: TDR Run Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - uses: nationalarchives/tdr-github-actions/.github/actions/run-git-secrets@f563794aa48b4ea16cae01caf704aa241a37539f # v0.0.48
      - uses: nationalarchives/tdr-github-actions/.github/actions/slack-send@f563794aa48b4ea16cae01caf704aa241a37539f # v0.0.48
        if: failure()
        with:
          message: ":warning: Secrets found in repository ${{ inputs.repo-name }}"
          slack-url: ${{ secrets.SLACK_WEBHOOK }}
      - name: Run tests
        run: sbt copySchema test
