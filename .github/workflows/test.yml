name: TDR Run Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13
      - uses: nationalarchives/tdr-github-actions/.github/actions/run-git-secrets@fc52a93f9636579d7478f01a8a960007134ad30f # v0.0.51
      - uses: nationalarchives/tdr-github-actions/.github/actions/slack-send@fc52a93f9636579d7478f01a8a960007134ad30f # v0.0.51
        if: failure()
        with:
          message: ":warning: Secrets found in repository ${{ inputs.repo-name }}"
          slack-url: ${{ secrets.SLACK_WEBHOOK }}
      - name: Run tests
        run: sbt copySchema test
